    <radialGradient id="g"><stop stop-color="#1f7cff" stop-opacity=".34"/><stop offset="1" stop-color="#1f7cff" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
