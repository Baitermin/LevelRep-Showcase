<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">LevelRep showcase hero</title>
  <desc id="desc">LevelRep branding beside three dark mobile app mockups.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset="0.55" stop-color="#071329"/><stop offset="1" stop-color="#02050b"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2276ff"/><stop offset="1" stop-color="#50a4ff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#1479ff" stop-opacity=".3"/><stop offset="1" stop-color="#1479ff" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="blueGlow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <circle cx="1210" cy="330" r="430" fill="url(#glow)"/>
  <g opacity=".13" stroke="#3688ff"><path d="M0 610H1600"/><path d="M0 645H1600"/><path d="M120 0V700"/><path d="M1480 0V700"/></g>
  <g transform="translate(92 194)">
    <text x="0" y="104" fill="#f7f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="108" font-weight="800">Level<tspan fill="#2e84ff">Rep</tspan></text>
    <text x="4" y="164" fill="#9ab8e7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32">Every rep levels you up.</text>
    <text x="4" y="232" fill="#cad6ea" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">AI-assisted training · Progression · Gamification</text>
    <g transform="translate(4 278)"><rect width="245" height="52" rx="26" fill="#0d1a31" stroke="#296fd6"/><circle cx="28" cy="26" r="7" fill="#4fa2ff"/><text x="48" y="34" fill="#d9e8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">Phase 1 complete</text></g>
  </g>
  <!-- phone 1 -->
  <g transform="translate(810 132) rotate(-5 155 255)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="520" rx="48" fill="#0b0f18" stroke="#637694" stroke-width="4"/>
    <rect x="13" y="15" width="284" height="490" rx="38" fill="#050a16"/>
    <circle cx="155" cy="31" r="8" fill="#111927"/>
    <text x="155" y="185" text-anchor="middle" fill="#f8fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">Level<tspan fill="#2d84ff">Rep</tspan></text>
    <text x="155" y="220" text-anchor="middle" fill="#69a9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Every rep levels you up.</text>
    <rect x="44" y="410" width="222" height="48" rx="14" fill="url(#blue)"/>
    <text x="155" y="441" text-anchor="middle" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Get Started</text>
  </g>
  <!-- phone 2 -->
  <g transform="translate(1035 80)" filter="url(#shadow)">
    <rect width="330" height="560" rx="50" fill="#0b0f18" stroke="#6d7d99" stroke-width="4"/>
    <rect x="14" y="15" width="302" height="530" rx="39" fill="#060b16"/>
    <circle cx="165" cy="31" r="8" fill="#111927"/>
    <rect x="34" y="82" width="58" height="5" rx="3" fill="#2582ff"/><rect x="98" y="82" width="38" height="5" rx="3" fill="#17243a"/><rect x="142" y="82" width="38" height="5" rx="3" fill="#17243a"/><rect x="186" y="82" width="38" height="5" rx="3" fill="#17243a"/><rect x="230" y="82" width="38" height="5" rx="3" fill="#17243a"/>
    <text x="34" y="138" fill="#f7f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">What is your main goal?</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15"><rect x="34" y="167" width="262" height="60" rx="16" fill="#0d1b32" stroke="#2b82ff" stroke-width="2"/><text x="56" y="203" fill="#e8f2ff">Build Muscle</text><circle cx="266" cy="197" r="10" fill="#2782ff"/><path d="M261 197l4 4 7-9" fill="none" stroke="white" stroke-width="2"/>
    <rect x="34" y="239" width="262" height="60" rx="16" fill="#0a101d" stroke="#1c2940"/><text x="56" y="275" fill="#9cafcc">Get Stronger</text>
    <rect x="34" y="311" width="262" height="60" rx="16" fill="#0a101d" stroke="#1c2940"/><text x="56" y="347" fill="#9cafcc">General Fitness</text></g>
    <rect x="34" y="470" width="262" height="48" rx="14" fill="url(#blue)"/><text x="165" y="501" text-anchor="middle" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Continue</text>
  </g>
  <!-- phone 3 -->
  <g transform="translate(1325 142) rotate(5 130 240)" filter="url(#shadow)">
    <rect width="260" height="480" rx="42" fill="#0b0f18" stroke="#61718b" stroke-width="4"/>
    <rect x="12" y="14" width="236" height="452" rx="34" fill="#060b16"/>
    <circle cx="130" cy="28" r="7" fill="#111927"/>
    <text x="28" y="82" fill="#f7f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800">Profile</text>
    <circle cx="130" cy="139" r="40" fill="#10182a" stroke="#2c83ff"/><text x="130" y="150" text-anchor="middle" fill="#6facff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">B</text>
    <rect x="27" y="194" width="206" height="78" rx="15" fill="#0b1322" stroke="#1a2942"/><text x="42" y="221" fill="#768aa9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">USERNAME</text><text x="42" y="248" fill="#e8f2ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">baitermin</text>
    <rect x="27" y="289" width="206" height="104" rx="15" fill="#0b1322" stroke="#1a2942"/><text x="42" y="318" fill="#e8f2ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Training Preferences</text><rect x="42" y="338" width="76" height="30" rx="15" fill="#16386c" stroke="#2b82ff"/><text x="80" y="359" text-anchor="middle" fill="#b9d7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">4x / week</text>
    <g transform="translate(28 423)" fill="#6880a6"><circle cx="18" cy="18" r="8"/><circle cx="70" cy="18" r="8"/><circle cx="122" cy="18" r="8"/><circle cx="174" cy="18" r="8"/><circle cx="206" cy="18" r="9" fill="#2b82ff"/></g>
  </g>
  <g transform="translate(92 628)"><line x1="0" y1="0" x2="1416" y2="0" stroke="#1b3f76"/><text x="0" y="38" fill="#5c769d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Cross-platform · iOS + Android · React Native · Expo · Supabase</text></g>
</svg>