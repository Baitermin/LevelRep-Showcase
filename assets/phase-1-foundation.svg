<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071123"/>
      <stop offset="1" stop-color="#02050b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6fff"/>
      <stop offset="1" stop-color="#55a8ff"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="460" r="560" fill="#0a1b37" opacity="0.32"/>
  <line x1="0" y1="820" x2="1600" y2="820" stroke="#17345f" stroke-width="2"/>

  <text x="800" y="72" text-anchor="middle" fill="#eef4ff" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" letter-spacing="6">PHASE 1 — FOUNDATION</text>
  <text x="800" y="108" text-anchor="middle" fill="#6582ad" font-family="Arial,Helvetica,sans-serif" font-size="17">Authentication · Onboarding · Profile · Supabase foundation</text>

  <!-- Welcome phone -->
  <g transform="translate(70 155)">
    <rect width="330" height="610" rx="48" fill="#111827" stroke="#536887" stroke-width="4"/>
    <rect x="13" y="14" width="304" height="582" rx="38" fill="#050a15"/>
    <circle cx="165" cy="31" r="7" fill="#182238"/>
    <circle cx="165" cy="238" r="112" fill="#071a3d"/>
    <text x="165" y="250" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">Level<tspan fill="#3388ff">Rep</tspan></text>
    <text x="165" y="286" text-anchor="middle" fill="#65a7ff" font-family="Arial,Helvetica,sans-serif" font-size="16">Every rep levels you up.</text>
    <text x="165" y="344" text-anchor="middle" fill="#a9bad3" font-family="Arial,Helvetica,sans-serif" font-size="14">Build your training profile</text>
    <text x="165" y="367" text-anchor="middle" fill="#a9bad3" font-family="Arial,Helvetica,sans-serif" font-size="14">and personalize your training.</text>
    <rect x="45" y="510" width="240" height="52" rx="15" fill="url(#accent)"/>
    <text x="165" y="543" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Get Started</text>
  </g>

  <!-- Onboarding phone -->
  <g transform="translate(440 135)">
    <rect width="330" height="650" rx="48" fill="#111827" stroke="#536887" stroke-width="4"/>
    <rect x="13" y="14" width="304" height="622" rx="38" fill="#060b16"/>
    <circle cx="165" cy="31" r="7" fill="#182238"/>
    <rect x="34" y="72" width="54" height="5" rx="3" fill="#3288ff"/>
    <rect x="95" y="72" width="42" height="5" rx="3" fill="#17243a"/>
    <rect x="144" y="72" width="42" height="5" rx="3" fill="#17243a"/>
    <rect x="193" y="72" width="42" height="5" rx="3" fill="#17243a"/>
    <rect x="242" y="72" width="42" height="5" rx="3" fill="#17243a"/>
    <text x="34" y="125" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">What's your main goal?</text>
    <rect x="34" y="152" width="262" height="58" rx="16" fill="#102a52" stroke="#3388ff" stroke-width="2"/>
    <text x="55" y="188" fill="#e8f3ff" font-family="Arial,Helvetica,sans-serif" font-size="15">Build Muscle</text>
    <circle cx="268" cy="181" r="10" fill="#3388ff"/>
    <polyline points="263,181 267,185 274,176" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="34" y="222" width="262" height="58" rx="16" fill="#0b1322" stroke="#1d2c46"/>
    <text x="55" y="258" fill="#9eb0cb" font-family="Arial,Helvetica,sans-serif" font-size="15">Get Stronger</text>
    <rect x="34" y="292" width="262" height="58" rx="16" fill="#0b1322" stroke="#1d2c46"/>
    <text x="55" y="328" fill="#9eb0cb" font-family="Arial,Helvetica,sans-serif" font-size="15">General Fitness</text>
    <text x="34" y="404" fill="#7188aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">TRAINING FREQUENCY</text>
    <rect x="34" y="419" width="262" height="46" rx="18" fill="#0a101d" stroke="#1e2b42"/>
    <g font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#9fb2cf">
      <text x="53" y="448">1x</text><text x="90" y="448">2x</text><text x="127" y="448">3x</text><text x="164" y="448" fill="#5fa6ff">4x</text><text x="201" y="448">5x</text><text x="238" y="448">6x</text><text x="275" y="448">7x</text>
    </g>
    <rect x="34" y="552" width="262" height="50" rx="15" fill="url(#accent)"/>
    <text x="165" y="584" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Continue</text>
  </g>

  <!-- Profile phone -->
  <g transform="translate(810 135)">
    <rect width="330" height="650" rx="48" fill="#111827" stroke="#536887" stroke-width="4"/>
    <rect x="13" y="14" width="304" height="622" rx="38" fill="#060b16"/>
    <circle cx="165" cy="31" r="7" fill="#182238"/>
    <text x="34" y="83" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Profile</text>
    <rect x="34" y="105" width="262" height="150" rx="18" fill="#0b1322" stroke="#1d2c46"/>
    <circle cx="165" cy="158" r="36" fill="#0e203d" stroke="#3388ff" stroke-width="2"/>
    <text x="165" y="169" text-anchor="middle" fill="#6bacff" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">B</text>
    <text x="50" y="219" fill="#7289aa" font-family="Arial,Helvetica,sans-serif" font-size="11">USERNAME</text>
    <text x="50" y="242" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="16">baitermin</text>
    <rect x="34" y="273" width="262" height="174" rx="18" fill="#0b1322" stroke="#1d2c46"/>
    <text x="50" y="305" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Body &amp; Measurements</text>
    <text x="50" y="344" fill="#8094b5" font-family="Arial,Helvetica,sans-serif" font-size="12">Height</text>
    <text x="275" y="344" text-anchor="end" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="14">178 cm</text>
    <text x="50" y="382" fill="#8094b5" font-family="Arial,Helvetica,sans-serif" font-size="12">Weight</text>
    <text x="275" y="382" text-anchor="end" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="14">64.5 kg</text>
    <text x="50" y="420" fill="#8094b5" font-family="Arial,Helvetica,sans-serif" font-size="12">Training</text>
    <text x="275" y="420" text-anchor="end" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="14">4x / week</text>
    <rect x="34" y="466" width="262" height="96" rx="18" fill="#0b1322" stroke="#1d2c46"/>
    <text x="50" y="497" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Equipment</text>
    <rect x="50" y="515" width="116" height="30" rx="15" fill="#15386e" stroke="#3388ff"/>
    <text x="108" y="535" text-anchor="middle" fill="#d7e9ff" font-family="Arial,Helvetica,sans-serif" font-size="12">All Equipment</text>
  </g>

  <!-- Sign-in phone -->
  <g transform="translate(1180 155)">
    <rect width="330" height="610" rx="48" fill="#111827" stroke="#536887" stroke-width="4"/>
    <rect x="13" y="14" width="304" height="582" rx="38" fill="#050a15"/>
    <circle cx="165" cy="31" r="7" fill="#182238"/>
    <text x="165" y="174" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">Level<tspan fill="#3388ff">Rep</tspan></text>
    <rect x="36" y="225" width="258" height="54" rx="14" fill="#0b1322" stroke="#1d2c46"/>
    <text x="57" y="258" fill="#8296b5" font-family="Arial,Helvetica,sans-serif" font-size="14">Email</text>
    <rect x="36" y="293" width="258" height="54" rx="14" fill="#0b1322" stroke="#1d2c46"/>
    <text x="57" y="326" fill="#8296b5" font-family="Arial,Helvetica,sans-serif" font-size="14">Password</text>
    <rect x="36" y="373" width="258" height="50" rx="14" fill="url(#accent)"/>
    <text x="165" y="405" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Sign in</text>
    <text x="165" y="461" text-anchor="middle" fill="#637797" font-family="Arial,Helvetica,sans-serif" font-size="13">or</text>
    <rect x="36" y="484" width="258" height="50" rx="14" fill="#080d17" stroke="#475b7a"/>
    <circle cx="63" cy="509" r="9" fill="#f4f7fb"/>
    <text x="170" y="515" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="14">Continue with Google</text>
    <text x="165" y="571" text-anchor="middle" fill="#778cac" font-family="Arial,Helvetica,sans-serif" font-size="12">New here? Sign up</text>
  </g>

  <text x="800" y="852" text-anchor="middle" fill="#506b92" font-family="Arial,Helvetica,sans-serif" font-size="15">Public showcase composition — no private backend data or production source code</text>
</svg>